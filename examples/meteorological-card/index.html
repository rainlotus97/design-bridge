<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>气象信息卡片 (CSS 标准自适应规范)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./tokens.css">
  <style>
    /* 兜底嵌入 Design Tokens，确保 file:/// 本地双击与独立运行时完全正常 */
    :root {
      --design-max-width: 388px;
      --design-min-height: 360px;
      --design-card-radius: 20px;
      --design-bg-gradient: linear-gradient(135deg, rgba(32, 37, 54, 0.95) 0%, rgba(14, 16, 25, 0.98) 100%);
      --design-card-border: rgba(108, 111, 127, 0.4);
      --design-card-blur: 10px;
      --design-divider: rgba(255, 255, 255, 0.08);
      --design-text-primary: #FFFFFF;
      --design-text-secondary: #BBC3C9;
    }
  </style>
</head>
<body class="bg-[#0b0d14] min-h-screen flex flex-col items-center justify-center p-4 font-sans antialiased select-none">

  <!-- 
    气象信息卡片 (Elastic Responsive Component)
    标准规范特性：
    1. 自适应弹性容器：w-full max-w-[388px]，高度随内容弹性分布，拒绝死高度与硬编码
    2. 盒模型分割体系：使用标准 border-b / border-r，彻底杜绝 absolute left-[128px] 等脆弱定位
    3. 静态资产解耦：图标全部抽离为独立的 .svg 资源引用，严禁代码堆砌内联 SVG
    4. 跨平台语义：所有变量与结构在 鸿蒙 ArkUI (Row/Column) 与 Qt (Layout/Rectangle) 均有迹可循
  -->
  <div 
    id="meteorological-card"
    class="w-full max-w-[388px] min-h-[360px] rounded-[20px] overflow-hidden text-white border border-[#6C6F7F]/40 shadow-2xl flex flex-col justify-between"
    style="background: var(--design-bg-gradient); backdrop-filter: blur(var(--design-card-blur)); -webkit-backdrop-filter: blur(var(--design-card-blur));"
  >
    <!-- Header 标题栏 (弹性高度 ~70px) -->
    <div class="h-[70px] px-6 flex items-center justify-between border-b border-white/[0.08] shrink-0">
      <span class="text-[20px] font-semibold text-white tracking-normal leading-none">气象信息</span>
      <button 
        type="button" 
        onclick="this.closest('#meteorological-card').style.opacity='0'; setTimeout(()=>this.closest('#meteorological-card').style.display='none', 200);"
        class="w-6 h-6 flex items-center justify-center text-[#BBC3C9] hover:text-white transition cursor-pointer"
        aria-label="关闭"
      >
        <img src="./icons/close.svg" class="w-3.5 h-3.5" alt="close" />
      </button>
    </div>

    <!-- Row 1: 风向风速 (弹性行高 ~40px) -->
    <div class="h-[40px] px-6 flex items-center justify-between border-b border-white/[0.08] shrink-0">
      <div class="flex items-center gap-2.5">
        <img src="./icons/wind.svg" class="w-3.5 h-3.5 shrink-0" alt="风向风速" />
        <span class="text-[14px] text-white/90">风向风速</span>
      </div>
      <div class="flex items-baseline">
        <span class="text-[20px] font-bold text-white tracking-tight">4.5</span>
        <span class="text-[14px] text-[#BBC3C9] ml-1.5 font-normal">m/s</span>
      </div>
    </div>

    <!-- Row 2: 有效波高 (与 Row 3 同属波况视觉组，底部无横线) -->
    <div class="h-[40px] px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <img src="./icons/wave.svg" class="w-3.5 h-3.5 shrink-0" alt="有效波高" />
        <span class="text-[14px] text-white/90">有效波高</span>
      </div>
      <div class="flex items-baseline">
        <span class="text-[20px] font-bold text-white tracking-tight">0.2</span>
        <span class="text-[14px] text-[#BBC3C9] ml-1.5 font-normal">m</span>
      </div>
    </div>

    <!-- Row 3: 双列网格 (风浪高度 / 平均周期) - 使用标准 Flex 分列与边框 -->
    <div class="h-[69px] px-6 flex items-center border-b border-white/[0.08] shrink-0">
      <!-- Col 1: 风浪高度 -->
      <div class="flex-1 flex flex-col justify-center pr-4 border-r border-white/[0.08]">
        <div class="flex items-center gap-2.5">
          <img src="./icons/wave.svg" class="w-3.5 h-3.5 shrink-0" alt="风浪高度" />
          <span class="text-[14px] text-white/90">风浪高度</span>
        </div>
        <div class="flex items-baseline mt-1 pl-[22px]">
          <span class="text-[20px] font-bold text-white leading-none">0.2</span>
          <span class="text-[14px] text-[#BBC3C9] ml-1 font-normal">m</span>
        </div>
      </div>
      <!-- Col 2: 平均周期 -->
      <div class="flex-1 flex flex-col justify-center pl-6">
        <div class="flex items-center gap-2.5">
          <img src="./icons/calendar.svg" class="w-3.5 h-3.5 shrink-0" alt="平均周期" />
          <span class="text-[14px] text-white/90">平均周期</span>
        </div>
        <div class="flex items-baseline mt-1 pl-[22px]">
          <span class="text-[20px] font-bold text-white leading-none">3.0</span>
          <span class="text-[14px] text-[#BBC3C9] ml-1 font-normal">s</span>
        </div>
      </div>
    </div>

    <!-- Row 4: 三列网格 (涌高 / 涌向 / 平均周期) - 标准弹性比例与自适应分割线 -->
    <div class="h-[68px] px-6 flex items-center border-b border-white/[0.08] shrink-0">
      <!-- Col 1: 涌高 (固定基底 ~104px) -->
      <div class="w-[104px] shrink-0 flex flex-col justify-center pr-2 border-r border-white/[0.08]">
        <div class="flex items-center gap-1.5">
          <img src="./icons/wave.svg" class="w-3.5 h-3.5 shrink-0" alt="涌高" />
          <span class="text-[14px] text-white/90">涌高</span>
        </div>
        <div class="flex items-baseline mt-1 pl-[20px]">
          <span class="text-[20px] font-bold text-white leading-none">0.1</span>
          <span class="text-[14px] text-[#BBC3C9] ml-1 font-normal">m</span>
        </div>
      </div>
      <!-- Col 2: 涌向 (自适应 ~120px) -->
      <div class="w-[120px] shrink-0 flex flex-col justify-center px-4 border-r border-white/[0.08]">
        <div class="flex items-center gap-1.5">
          <img src="./icons/arrow.svg" class="w-3.5 h-3.5 shrink-0" alt="涌向" />
          <span class="text-[14px] text-white/90">涌向</span>
        </div>
        <div class="mt-1 pl-[20px]">
          <span class="text-[20px] font-bold text-white leading-none tracking-normal">ENE</span>
        </div>
      </div>
      <!-- Col 3: 平均周期 (弹性占据剩余空间) -->
      <div class="flex-1 flex flex-col justify-center pl-4">
        <div class="flex items-center gap-1.5">
          <img src="./icons/calendar.svg" class="w-3.5 h-3.5 shrink-0" alt="平均周期" />
          <span class="text-[14px] text-white/90 whitespace-nowrap">平均周期</span>
        </div>
        <div class="flex items-baseline mt-1 pl-[20px]">
          <span class="text-[20px] font-bold text-white leading-none">3.5</span>
          <span class="text-[14px] text-[#BBC3C9] ml-1 font-normal">s</span>
        </div>
      </div>
    </div>

    <!-- Row 5: 双列网格 (流速 / 流向) - 标准 Flex 分列与边框 -->
    <div class="h-[73px] px-6 flex items-center shrink-0">
      <!-- Col 1: 流速 -->
      <div class="flex-1 flex flex-col justify-center pr-4 border-r border-white/[0.08]">
        <div class="flex items-center gap-2.5">
          <img src="./icons/flow.svg" class="w-3.5 h-3.5 shrink-0" alt="流速" />
          <span class="text-[14px] text-white/90">流速</span>
        </div>
        <div class="flex items-baseline mt-1 pl-[22px]">
          <span class="text-[20px] font-bold text-white leading-none">0.2</span>
          <span class="text-[14px] text-[#BBC3C9] ml-1 font-normal">kn</span>
        </div>
      </div>
      <!-- Col 2: 流向 -->
      <div class="flex-1 flex flex-col justify-center pl-6">
        <div class="flex items-center gap-2.5">
          <img src="./icons/arrow.svg" class="w-3.5 h-3.5 shrink-0" alt="流向" />
          <span class="text-[14px] text-white/90">流向</span>
        </div>
        <div class="mt-1 pl-[22px]">
          <span class="text-[20px] font-bold text-white leading-none tracking-normal">NE</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
