<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>气象信息卡片 (Meteorological Card) - JS + Tailwind 实现</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b0e17] min-h-screen flex flex-col items-center justify-center p-6 text-slate-100 antialiased relative overflow-hidden select-none">

  <!-- 海洋/航海雷达拟物化背景光晕 (演示 Glassmorphism 毛玻璃效果) -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px]"></div>
    <div class="absolute top-1/2 -right-32 w-80 h-80 bg-teal-500/15 rounded-full blur-[100px]"></div>
    <div class="absolute -bottom-20 left-1/3 w-[500px] h-[500px] bg-indigo-900/25 rounded-full blur-[140px]"></div>
    
    <!-- 经纬度/网格背景底纹 -->
    <div class="absolute inset-0 opacity-[0.03]" style="background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 40px 40px;"></div>
  </div>

  <div class="relative z-10 flex flex-col items-center gap-8 max-w-lg w-full">
    
    <!-- 顶部状态提示 -->
    <div class="text-center">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs text-slate-400 mb-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        MasterGo 设计稿 1:1 像素级还原 (DesignBridge)
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">海况与气象实时监测终端</h1>
    </div>

    <!-- 卡片挂载容器 -->
    <div id="card-mount-point" class="transition-all duration-300"></div>

    <!-- 交互模拟控制条 -->
    <div class="flex items-center gap-3 p-2 rounded-2xl bg-white/[0.04] border border-white/10 backdrop-blur-md shadow-lg">
      <button 
        id="btn-simulate"
        class="px-4 py-2 text-xs font-medium text-white bg-blue-600/80 hover:bg-blue-500 active:scale-95 rounded-xl transition shadow-md flex items-center gap-1.5 cursor-pointer"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        模拟气象跳变
      </button>

      <button 
        id="btn-reset"
        class="px-3.5 py-2 text-xs font-medium text-slate-300 hover:text-white hover:bg-white/10 active:scale-95 rounded-xl transition cursor-pointer"
      >
        重置初值
      </button>

      <button 
        id="btn-toggle"
        class="px-3.5 py-2 text-xs font-medium text-slate-300 hover:text-white hover:bg-white/10 active:scale-95 rounded-xl transition cursor-pointer"
      >
        切换显示
      </button>
    </div>

  </div>

  <!-- 引入 ES Module 组件 -->
  <script type="module">
    import { createMeteorologicalCard, DEFAULT_WEATHER_DATA } from './MeteorologicalCard.js';

    // 实例化卡片组件
    const card = createMeteorologicalCard('#card-mount-point', DEFAULT_WEATHER_DATA, {
      onClose: () => {
        console.log('气象卡片关闭事件触发');
        const mount = document.querySelector('#card-mount-point');
        mount.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
      }
    });

    // 1. 模拟实时气象跳变
    document.getElementById('btn-simulate').addEventListener('click', () => {
      const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      const randDir = () => directions[Math.floor(Math.random() * directions.length)];
      
      card.update({
        windSpeed: (3.0 + Math.random() * 4).toFixed(1),
        sigWaveHeight: (0.1 + Math.random() * 0.8).toFixed(1),
        waveHeight: (0.1 + Math.random() * 0.5).toFixed(1),
        wavePeriod: (2.5 + Math.random() * 2).toFixed(1),
        swellHeight: (0.1 + Math.random() * 0.4).toFixed(1),
        swellDirection: randDir(),
        swellPeriod: (3.0 + Math.random() * 2).toFixed(1),
        currentSpeed: (0.1 + Math.random() * 0.6).toFixed(1),
        currentDirection: randDir()
      });
    });

    // 2. 重置初值
    document.getElementById('btn-reset').addEventListener('click', () => {
      card.update(DEFAULT_WEATHER_DATA);
    });

    // 3. 切换显示
    document.getElementById('btn-toggle').addEventListener('click', () => {
      const mount = document.querySelector('#card-mount-point');
      if (mount.classList.contains('opacity-0')) {
        mount.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
        card.show();
      } else {
        mount.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
      }
    });
  </script>
</body>
</html>
