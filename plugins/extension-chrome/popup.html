<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.2);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.2);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .card {
      background: #1E293B;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #2563EB;
      color: #FFF;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1D4ED8;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #CBD5E1;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title"><span>⚡</span> DesignBridge</div>
    <div id="status" class="status-badge status-offline">检测中...</div>
  </div>

  <div class="card">
    在 MasterGo、Figma 页面右下角会自动显示 <strong>⚡ 发送到 AI</strong> 胶囊按钮。<br/>
    或者，您可直接打开 Web 控制台粘贴截图与代码。
  </div>

  <button id="open-web-btn" class="btn">🌐 打开 Web 捕获中心</button>
  <button id="check-btn" class="btn btn-secondary">🔄 重新检测本地服务</button>

  <script src="popup.js"></script>
</body>
</html>
