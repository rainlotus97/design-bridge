<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B0F19;
      color: #F8FAFC;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.2);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.2);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .card {
      background: #151D2F;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #2563EB;
      color: #FFF;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #1D4ED8;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #CBD5E1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .btn-cyan {
      background: rgba(56, 189, 248, 0.18);
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .btn-cyan:hover {
      background: rgba(56, 189, 248, 0.28);
    }
    .hotkey-tag {
      font-size: 10px;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 5px;
      border-radius: 4px;
      opacity: 0.8;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title"><span>⚡</span> DesignBridge</div>
    <div id="status" class="status-badge status-offline">检测中...</div>
  </div>

  <div class="card">
    <strong>快捷直推说明：</strong><br/>
    • <strong>MasterGo / Figma</strong>：选中图层按 <code>Ctrl+C</code> 即全自动推送。<br/>
    • <strong>任意网页</strong>：点击下方或按 <code>Alt+X</code>，悬浮选中任意元素点击即推送！
  </div>

  <div class="btn-group">
    <button id="inspect-btn" class="btn btn-cyan">
      <span>🎯</span> 开启当前网页【元素点选直推】 <span class="hotkey-tag">Alt+X</span>
    </button>
    <button id="clipboard-push-btn" class="btn btn-secondary">
      <span>📋</span> 剪贴板一键直推入待办池 <span class="hotkey-tag">Alt+S</span>
    </button>
    <button id="open-web-btn" class="btn">
      <span>🌐</span> 打开设计待办总览
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
